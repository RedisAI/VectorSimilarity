on: workflow_call

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: start
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          # Ubuntu 22.04 AMI
          ec2-image-id: ami-09fabd03bb09b3704
          ec2-instance-type: c7i.xlarge
          subnet-id: ${{ secrets.AWS_EC2_SUBNET_ID_BENCHMARK }}
          security-group-id: ${{ secrets.AWS_EC2_SG_ID_BENCHMARK }}


  codecov:
    name: codecov job
    needs: start-runner # required to start the main job when the runner is ready
    runs-on: ${{ needs.start-runner.outputs.label }} # run the job on the newly created runner
    steps:
      - name: Start resource telemetry
        run: |
          cat > /tmp/coverage-monitor.sh <<'MONITOR'
          #!/bin/bash
          while true; do
            {
              echo "VECSIM_DIAG $(date -u +%FT%TZ)"
              free -m
              df -m / /tmp
              ps -eo comm,rss --sort=-rss | head -8
              cat /proc/pressure/memory /proc/pressure/io
            } | sed 's/^/VECSIM_DIAG /' | tee /dev/console
            sleep 15
          done
          MONITOR
          sudo env -u RUNNER_TRACKING_ID nohup bash /tmp/coverage-monitor.sh > /tmp/coverage-monitor.log 2>&1 &
      - name: Pre checkout deps
        run:  sudo apt-get update && sudo apt-get install -y git
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Print CPU information
        run: |
          echo "=== CPU Information ==="
          if command -v lscpu >/dev/null 2>&1; then
            echo "--- lscpu output ---"
            lscpu
          else
            echo "--- Fallback CPU info ---"
            cat /proc/cpuinfo 2>/dev/null || echo "CPU info not available"
          fi
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: ${{ runner.arch }}"
          echo "========================"
      - name: install dependencies
        run: sudo .install/install_script.sh
      - name: Install clang 18
        run: |
          # Download and run the official LLVM installation script
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -yqq clang-18 clang++-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 --slave /usr/bin/clang++ clang++ /usr/bin/clang++-18

          echo `clang --version`
          echo `clang++ --version`
      - name: run codecov
        run: make coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6 # NOSONAR
        with:
          files: ./bin/Linux-x86_64-debug/cov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_safe_directory: true
          disable_search: true
      - name: Sanitizer tests
        run: make asan
      - name: Set test path
        if: failure()
        id: tests-artifact-path
        run: |
          FULL_VARIANT=$(uname)-$(uname -m)-debug-asan
          echo "path=bin/${FULL_VARIANT}/unit_tests/Testing/Temporary/" >> $GITHUB_OUTPUT
      - name: Archive san tests reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: san tests reports on intel
          path: ${{ steps.tests-artifact-path.outputs.path }}

  diagnostics:
    name: Observe EC2 health
    needs: start-runner
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Observe instance and console
        env:
          INSTANCE_ID: ${{ needs.start-runner.outputs.ec2-instance-id }}
        run: |
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[].Instances[].{Type:InstanceType,State:State,BlockDevices:BlockDeviceMappings,LaunchTime:LaunchTime}' || true
          aws ec2 describe-images --image-ids ami-09fabd03bb09b3704 --query 'Images[].{Name:Name,BlockDevices:BlockDeviceMappings}' || true
          for attempt in $(seq 1 45); do
            date -u
            aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" --include-all-instances || true
            aws ec2 get-console-output --instance-id "$INSTANCE_ID" --latest --output json > /tmp/console.json || true
            python3 - <<'FILTER'
          import json
          try:
              output = json.load(open('/tmp/console.json')).get('Output', '') or ''
              for line in output.splitlines():
                  if any(word in line.lower() for word in ['vecsim_diag', 'out of memory', 'oom-kill', 'killed process', 'no space left', 'i/o error', 'kernel panic']):
                      print(line)
          except (ValueError, OSError):
              pass
          FILTER
            state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text) || true
            if [ "$state" = terminated ] || [ "$state" = shutting-down ]; then break; fi
            sleep 60
          done

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - codecov
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
