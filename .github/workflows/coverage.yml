on: workflow_call

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: start
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          # Ubuntu 22.04 AMI
          ec2-image-id: ami-09fabd03bb09b3704
          ec2-instance-type: c7i.xlarge
          subnet-id: ${{ secrets.AWS_EC2_SUBNET_ID_BENCHMARK }}
          security-group-id: ${{ secrets.AWS_EC2_SG_ID_BENCHMARK }}


  codecov:
    name: codecov job
    needs: start-runner # required to start the main job when the runner is ready
    runs-on: ${{ needs.start-runner.outputs.label }} # run the job on the newly created runner
    steps:
      - name: Start resource telemetry
        env:
          DIAG_TOKEN: ${{ github.token }}
          DIAG_SHA: ${{ github.sha }}
          DIAG_REPO: ${{ github.repository }}
        run: |
          cat > /tmp/coverage-monitor.py <<'MONITOR'
          import json, os, shutil, time, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['DIAG_REPO'] + '/check-runs'
          def request(url, method, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['DIAG_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          check = request(base, 'POST', {'name': 'Coverage resource telemetry', 'head_sha': os.environ['DIAG_SHA'], 'status': 'in_progress'})
          snapshots = []
          while True:
              mem = {}
              with open('/proc/meminfo') as source:
                  for line in source:
                      key, value = line.split(':', 1)
                      if key in ('MemTotal', 'MemAvailable', 'SwapTotal', 'SwapFree'):
                          mem[key + '_KiB'] = int(value.split()[0])
              with open('/proc/vmstat') as source:
                  oom_kills = next((int(line.split()[1]) for line in source if line.startswith('oom_kill ')), 0)
              sample = dict(timestamp=time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                            disk_free_MiB=shutil.disk_usage('/').free // (1024 * 1024),
                            disk_total_MiB=shutil.disk_usage('/').total // (1024 * 1024),
                            oom_kills=oom_kills, **mem)
              for resource in ('memory', 'io'):
                  with open('/proc/pressure/' + resource) as source:
                      for line in source:
                          fields = line.split()
                          sample[resource + '_' + fields[0] + '_avg10'] = float(fields[1].split('=')[1])
              output = json.dumps(sample) + '\n'
              snapshots.append(output)
              summary = ('```text\n' + '\n'.join(snapshots)[-55000:] + '\n```')
              try:
                  request(base + '/' + str(check['id']), 'PATCH', {'output': {'title': 'Numerical memory, disk and pressure counters', 'summary': summary}})
              except Exception as error:
                  print(type(error).__name__, flush=True)
              time.sleep(15)
          MONITOR
          sudo --preserve-env=DIAG_TOKEN,DIAG_SHA,DIAG_REPO env -u RUNNER_TRACKING_ID nohup python3 /tmp/coverage-monitor.py > /tmp/coverage-monitor.log 2>&1 &
          sleep 5
          cat /tmp/coverage-monitor.log
      - name: Pre checkout deps
        run:  sudo apt-get update && sudo apt-get install -y git
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Print CPU information
        run: |
          echo "=== CPU Information ==="
          if command -v lscpu >/dev/null 2>&1; then
            echo "--- lscpu output ---"
            lscpu
          else
            echo "--- Fallback CPU info ---"
            cat /proc/cpuinfo 2>/dev/null || echo "CPU info not available"
          fi
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: ${{ runner.arch }}"
          echo "========================"
      - name: install dependencies
        run: sudo .install/install_script.sh
      - name: Install clang 18
        run: |
          # Download and run the official LLVM installation script
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -yqq clang-18 clang++-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 --slave /usr/bin/clang++ clang++ /usr/bin/clang++-18

          echo `clang --version`
          echo `clang++ --version`
      - name: run codecov
        run: make coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6 # NOSONAR
        with:
          files: ./bin/Linux-x86_64-debug/cov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_safe_directory: true
          disable_search: true
      - name: Sanitizer tests
        run: make asan
      - name: Set test path
        if: failure()
        id: tests-artifact-path
        run: |
          FULL_VARIANT=$(uname)-$(uname -m)-debug-asan
          echo "path=bin/${FULL_VARIANT}/unit_tests/Testing/Temporary/" >> $GITHUB_OUTPUT
      - name: Archive san tests reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: san tests reports on intel
          path: ${{ steps.tests-artifact-path.outputs.path }}

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - codecov
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
