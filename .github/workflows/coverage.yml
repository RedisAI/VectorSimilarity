on: workflow_call

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Prepare EC2 owner tag
        id: ec2-tags
        # Keep the original workflow actor as owner, including on reruns.
        env:
          OWNER_HANDLE: ${{ github.actor }}
        shell: python
        run: |
          import os
          import re

          # Allow only lowercase ASCII letters, digits, and underscores.
          owner = os.environ["OWNER_HANDLE"].lower()
          owner = re.sub(r"[^a-z0-9_]", "_", owner)
          # Collapse repeated separators, cap at 63 characters, and trim edges.
          owner = re.sub(r"_+", "_", owner)[:63].strip("_")
          if not owner:
              raise SystemExit("Cannot derive an EC2 owner tag from github.actor")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"owner={owner}\n")
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: start
          aws-resource-tags: >-
            [
              {"Key": "team", "Value": "ai_and_search"},
              {"Key": "owner", "Value": "${{ steps.ec2-tags.outputs.owner }}"}
            ]
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          # Ubuntu 22.04 AMI
          ec2-image-id: ami-09fabd03bb09b3704
          ec2-instance-type: c7i.xlarge
          subnet-id: ${{ secrets.AWS_EC2_SUBNET_ID_BENCHMARK }}
          security-group-id: ${{ secrets.AWS_EC2_SG_ID_BENCHMARK }}


  codecov:
    name: codecov job
    needs: start-runner # required to start the main job when the runner is ready
    runs-on: ${{ needs.start-runner.outputs.label }} # run the job on the newly created runner
    steps:
      - name: Pre checkout deps
        run:  sudo apt-get update && sudo apt-get install -y git
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Print CPU information
        run: |
          echo "=== CPU Information ==="
          if command -v lscpu >/dev/null 2>&1; then
            echo "--- lscpu output ---"
            lscpu
          else
            echo "--- Fallback CPU info ---"
            cat /proc/cpuinfo 2>/dev/null || echo "CPU info not available"
          fi
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: ${{ runner.arch }}"
          echo "========================"
      - name: install dependencies
        run: sudo .install/install_script.sh
      - name: Install clang 18
        run: |
          # Download and run the official LLVM installation script
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -yqq clang-18 clang++-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100 --slave /usr/bin/clang++ clang++ /usr/bin/clang++-18

          echo `clang --version`
          echo `clang++ --version`
      - name: run codecov
        run: make coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6 # NOSONAR
        with:
          files: ./bin/Linux-x86_64-debug/cov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_safe_directory: true
          disable_search: true
      - name: Sanitizer tests
        run: make asan
      - name: Set test path
        if: failure()
        id: tests-artifact-path
        run: |
          FULL_VARIANT=$(uname)-$(uname -m)-debug-asan
          echo "path=bin/${FULL_VARIANT}/unit_tests/Testing/Temporary/" >> $GITHUB_OUTPUT
      - name: Archive san tests reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: san tests reports on intel
          path: ${{ steps.tests-artifact-path.outputs.path }}

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - codecov
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
