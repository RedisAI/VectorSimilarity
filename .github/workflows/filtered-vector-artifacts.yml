name: Filtered vector artifact tests

on:
  pull_request:
    paths:
      - 'tests/benchmark/filtered/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/VecSim/**'
      - '.github/workflows/filtered-vector-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'tests/benchmark/filtered/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/VecSim/**'
      - '.github/workflows/filtered-vector-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filtered-vector-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/benchmark/filtered/requirements.txt
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r tests/benchmark/filtered/requirements.txt
      - name: Build native filtered runner
        run: |
          cmake -S . -B "$RUNNER_TEMP/vecsim-filtered-build" -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SVS=OFF -DVECSIM_BUILD_TESTS=OFF -DVECSIM_BUILD_FILTERED_BENCHMARK=ON
          cmake --build "$RUNNER_TEMP/vecsim-filtered-build" --target native_filtered_bench native_filtered_bench_tests --parallel 2
          ctest --test-dir "$RUNNER_TEMP/vecsim-filtered-build" -R native_filtered_bench_tests --output-on-failure
      - name: Artifact, wrapper, and native integration tests
        env:
          VECSIM_FILTERED_BINARY: ${{ runner.temp }}/vecsim-filtered-build/filtered_benchmark/native_filtered_bench
        run: python -m unittest discover -s tests/benchmark/filtered -v
