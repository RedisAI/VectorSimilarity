name: Filtered vector artifact tests

on:
  pull_request:
    paths:
      - 'tests/benchmark/filtered/**'
      - '.github/workflows/filtered-vector-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'tests/benchmark/filtered/**'
      - '.github/workflows/filtered-vector-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filtered-vector-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/benchmark/filtered/requirements.txt
      - run: python -m pip install -r tests/benchmark/filtered/requirements.txt
      - run: python -m unittest discover -s tests/benchmark/filtered -v
