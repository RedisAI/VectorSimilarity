name: Inspect coverage EC2 infrastructure
on:
  push:
    branches: [debug/coverage-aws-observer]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION_BENCHMARK }}
      - name: Inspect disconnected coverage instances
        run: |
          ids=$(aws ec2 describe-instances --filters Name=image-id,Values=ami-09fabd03bb09b3704 --query "Reservations[].Instances[?LaunchTime>='2026-09-06T11:00:00Z'].InstanceId" --output text)
          for id in $ids; do
            aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[].Instances[].{Id:InstanceId,State:State,Launch:LaunchTime,Reason:StateTransitionReason,StateReason:StateReason}'
            aws ec2 describe-instance-status --instance-ids "$id" --include-all-instances
          done
