name: SQ8 exact L2 verification and benchmark

on:
  push:
    branches: [omer-lerman-sq8-exact-l2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: google/cpu_features
          ref: v0.10.1
          path: .repro-deps/cpu_features
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ clang cmake ninja-build
      - name: Verify then benchmark sequentially
        run: python3 .github/scripts/run-sq8-exact-ci.py
      - name: Retain all evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sq8-exact-${{ matrix.runner }}
          path: |
            sq8-exact-results/*.log
            sq8-exact-results/*.json
            sq8-exact-results/*.xml
            sq8-exact-results/*.md
          if-no-files-found: error
